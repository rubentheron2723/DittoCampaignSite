<!doctype html>
<html lang="en" class="booting">
  <head>
    <!-- White until the entry animation's white cover is up (boot.ts), so a page never flashes the black body first. -->
    <script>try{var m=localStorage.getItem('ditto:colour-mode');if(m==='dark')document.documentElement.dataset.mode='dark'}catch(e){}</script>
    <style>.booting, .booting body { background: #fefefe; } .booting[data-mode='dark'], .booting[data-mode='dark'] body { background: #171717; }</style>
    <!-- The entry animation and page transition both open on these clouds: fetch them before the scripts ask. -->
    <link rel="preload" href="/intro/clouds.webp" as="image" type="image/webp" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ditto | Terms of Service</title>
    <meta name="description" content="The terms for using Ditto, the fine print made simple." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
    />
  </head>
  <body data-page="terms">
    <div id="chrome"></div>
    <div id="smooth-wrapper">
      <div id="smooth-content">
        <main id="main"></main>
      </div>
    </div>
    <script type="module" src="/src/pages/terms.ts"></script>
  </body>
</html>
